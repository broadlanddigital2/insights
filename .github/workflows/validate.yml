name: Validate Insights build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: npm run build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          msg=$(sed -n '/Failed to compile/,$p' build.log | head -n 40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error::${msg:-$(tail -n 30 build.log | sed ':a;N;$!ba;s/\n/%0A/g')}"
      - run: npm run cloudflare:build
