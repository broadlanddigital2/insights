name: Deploy Supabase edge functions

# Deploys edge functions from this repo to the live Supabase project.
# - On push to main: deploys only the functions whose folder changed (web-recorder, insights-admin).
# - Manually: Actions -> "Deploy Supabase edge functions" -> Run workflow, and list the functions to deploy.
# Requires the repository secret SUPABASE_ACCESS_TOKEN (Supabase dashboard -> Account -> Access tokens).
# Without it the job is skipped, so nothing is deployed.
# All functions do their own auth checks, so they are deployed with JWT verification off, matching the live setup.

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated function names to deploy (e.g. "web-recorder insights-admin")'
        required: true

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dipjypzrfigkzuarlsov
    steps:
      - name: Check access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN secret is not set, so no functions were deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'
        with:
          fetch-depth: 2

      - name: Work out which functions to deploy
        if: steps.token.outputs.ready == 'true'
        id: which
        env:
          MANUAL: ${{ github.event.inputs.functions }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list="$MANUAL"
          else
            list=$(git diff --name-only HEAD~1 HEAD -- supabase/functions | cut -d/ -f3 | sort -u | tr '\n' ' ')
          fi
          deploy=""
          for f in $list; do
            if [ -f "supabase/functions/$f/index.ts" ] && ! echo " $deploy " | grep -q " $f "; then deploy="$deploy $f"; fi
          done
          echo "Functions to deploy:${deploy:- none}"
          echo "list=$deploy" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ready == 'true' && steps.which.outputs.list != ''
        with:
          version: latest

      - name: Deploy
        if: steps.token.outputs.ready == 'true' && steps.which.outputs.list != ''
        run: |
          failed=0
          for f in ${{ steps.which.outputs.list }}; do
            echo "::group::Deploying $f"
            if supabase functions deploy "$f" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api > "deploy-$f.log" 2>&1; then
              cat "deploy-$f.log"; echo "::notice title=Deployed $f::$(tail -n 1 "deploy-$f.log")"
            else
              cat "deploy-$f.log"; failed=1
              # Surface the CLI's own error text as an annotation, so it is visible without opening the log.
              msg=$(tail -n 15 "deploy-$f.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=Deploy of $f failed::$msg"
            fi
            echo "::endgroup::"
          done
          exit $failed
